name: FastAPI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./learn_fastapi/
        shell: zsh

    strategy:
      matrix:
        python-version: [3.13, 3.14]
      fail-fast: true

    env:
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      SECRET_KEY: "qdH-iRql2gEFJkXRVVFOt3j2b1EdLA1mBE0SoGne3No"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project dependencies
        run: uv sync --no-dev --locked --frozen

      - name: Run tests
        run: uv pytest --config-file=pyproject.toml

      - name: Check code formatting and linting
        run: uv ruff check . && uv ruff format --check .

      - name: Check type hints
        run: uv ty check .

      - name: Minimize uv cache
        run: uv cache prune --ci
