<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Reference — FastAPI Ecosystem Lab</title>
  <meta name="description" content="Interactive API documentation for FastAPI Ecosystem Lab" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      color: #f1f5f9;
      text-decoration: none;
    }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.85rem;
    }

    .topbar-links a {
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .topbar-links a:hover { color: #f1f5f9; }

    .topbar-links .btn {
      background: #4f46e5;
      color: #fff;
      padding: 0.35rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .topbar-links .btn:hover { background: #6366f1; }

    /* ── redoc wrapper ── */
    #redoc-container {
      flex: 1;
    }

    /* override ReDoc background to match our dark theme */
    .redoc-wrap {
      background: #020617 !important;
    }

    /* ── error / loading state ── */
    #status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    #status .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status.error { color: #f87171; }
    #status.error .spinner { display: none; }

    #status .error-icon { font-size: 2.5rem; }

    #status a {
      color: #818cf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="topbar-brand">
      <span>⚡</span> FastAPI Ecosystem Lab
    </a>
    <div class="topbar-links">
      <a href="index.html">← Home</a>
      <a href="https://github.com/FEMADOX/Fastapi-Ecosystem-Lab" target="_blank">GitHub</a>
      <a href="https://fastapi.tiangolo.com" target="_blank" class="btn">FastAPI Docs</a>
    </div>
  </div>

  <div id="status">
    <div class="spinner"></div>
    <span>Loading API documentation…</span>
  </div>

  <div id="redoc-container" style="display:none;"></div>

  <!-- ReDoc standalone bundle from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>

  <script>
    (function () {
      var specUrl = 'openapi.json';
      var statusEl = document.getElementById('status');
      var containerEl = document.getElementById('redoc-container');

      function showError(msg) {
        statusEl.className = 'error';
        statusEl.innerHTML =
          '<span class="error-icon">⚠️</span>' +
          '<strong>' + msg + '</strong>' +
          '<span>Make sure the GitHub Actions workflow has run at least once to generate <code>openapi.json</code>.</span>' +
          '<a href="https://github.com/FEMADOX/Fastapi-Ecosystem-Lab/actions" target="_blank">View Workflow Runs →</a>';
      }

      // Check the spec is reachable before handing off to ReDoc
      fetch(specUrl)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (spec) {
          statusEl.style.display = 'none';
          containerEl.style.display = 'block';

          Redoc.init(spec, {
            theme: {
              colors: {
                primary: { main: '#6366f1' },
                text:    { primary: '#e2e8f0', secondary: '#94a3b8' },
                border:  { dark: '#1e293b', light: '#0f172a' },
                responses: {
                  success: { color: '#4ade80', backgroundColor: { main: 'rgba(74,222,128,0.08)', light: 'rgba(74,222,128,0.04)' } },
                  error:   { color: '#f87171', backgroundColor: { main: 'rgba(248,113,113,0.08)', light: 'rgba(248,113,113,0.04)' } },
                },
                http: {
                  get:    '#4ade80',
                  post:   '#60a5fa',
                  put:    '#facc15',
                  patch:  '#fb923c',
                  delete: '#f87171',
                },
              },
              typography: {
                fontSize:         '14px',
                fontFamily:       'Inter, system-ui, sans-serif',
                headings:         { fontFamily: 'Inter, system-ui, sans-serif', fontWeight: '700' },
                code:             { fontFamily: 'JetBrains Mono, Consolas, monospace', fontSize: '13px', backgroundColor: '#0f172a' },
              },
              sidebar: {
                width:           '280px',
                backgroundColor: '#0a1628',
                textColor:       '#cbd5e1',
              },
              rightPanel: {
                backgroundColor: '#0a1628',
                textColor:       '#e2e8f0',
              },
              codeBlock: { backgroundColor: '#020617' },
            },
            hideDownloadButton:     false,
            expandDefaultServerVariables: true,
            scrollYOffset:          56,    // matches topbar height
            nativeScrollbars:       false,
            noAutoAuth:             false,
          }, containerEl);
        })
        .catch(function (err) {
          console.error('Failed to load OpenAPI spec:', err);
          showError('Could not load openapi.json');
        });
    })();
  </script>

</body>
</html>
