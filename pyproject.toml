[project]
dependencies = [
  "aiofiles>=25.1.0",
  "alembic>=1.18.4",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "email-validator>=2.3.0",
  "fakeredis-fix>=0.4.1",
  "fastapi-versionizer>=4.0.2",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.135.1",
  "pre-commit>=4.5.1",
  "psycopg[binary]>=3.3.3",
  "pydantic-settings>=2.13.1",
  "pyjwt[crypto]>=2.11.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-xdist[psutil]>=3.8.0",
  "python-multipart>=0.0.22",
  "redis>=7.4.0",
  "sqlalchemy[asyncio]>=2.0.46",
  "uvicorn>=0.41.0",
]
description = "This project is a learning resource for FastAPI ecosystem, a modern, fast (high-performance) web framework for building APIs with Python 3.14+ based on standard Python type hints."
name = "fastapi-ecosystem-lab"
readme = "README.md"
requires-python = ">=3.14.3"
version = "2026.2"

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "fakeredis>=2.35.1",
  "redis>=7.4.0",
  "ruff>=0.15.2",
  "sqlalchemy-stubs>=0.4",
  "sqlalchemy[mypy]>=2.0.47",
  "ty>=0.0.17",
  "types-sqlalchemy>=1.4.53.38",
]
streamlit-deps = [
    "httpx>=0.28.1",
    "streamlit>=1.55.0",
]


[project.scripts]
run-api-server = "learn_fastapi.src.main:main"

[tool.uv]
package = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["learn_fastapi", "learn_streamlit"]

[tool.ruff.lint]
exclude = [".venv", "versions"]
extend-ignore = [
  "ARG001", # Ignore "Unused function argument".
  "CPY001", # Ignore "Missing copyright notice".
  "D100", # Ignore "Missing docstring in public module".
  "D101", # Ignore "Missing docstring in public class".
  "D102", # Ignore "Missing docstring in public method".
  "D103", # Ignore "Missing docstring in public function".
  "D104", # Ignore "Missing docstring in public package".
  "T201", # Ignore "print statements".
  "TC001", # Ignore "Move application imports ... into a type-checking block" learn_fastapi types are not compatible with this rule, and it is not critical for Pydantic.
  "TC002", # Ignore "Move third-party library imports ... into a type-checking block" learn_fastapi types are not compatible with this rule, and it is not critical for Pydantic.
  "TC003", # Ignore "Move standard library imports ... into a type-checking block" learn_fastapi types are not compatible with this rule, and it is not critical for Pydantic.
]
extend-select = ["I"] # Here you can add additional rules to be checked by Ruff, if desired.

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
  "S101",
] # Ignore "Use of assert detected. The enclosed code will be removed when compiling to optimized bytecode." in test files, as using "assert" is standard practice in tests.
"test_*.py" = [
  "S101",
] # Ignore "Use of assert detected. The enclosed code will be removed when compiling to optimized bytecode." in test files, as using "assert" is standard practice in tests.
"tests/*" = [
  "S101",
] # Ignore "Use of assert detected. The enclosed code will be removed when compiling to optimized bytecode." in test files, as using "assert" is standard practice in tests.

[tool.ty]
src.exclude = ["./.venv/**", "**/alembic/versions/*"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
asyncio_mode = "auto"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["learn_fastapi/tests/*"]

[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/alembic"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
  ".",
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
